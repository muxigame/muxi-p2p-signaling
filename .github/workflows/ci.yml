name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements-dev.txt
          pip install --no-deps .
          python -B -m unittest discover -s tests -v
          cd / && python -c "import muxi_p2p_signaling, muxi_p2p_signaling.reflector"
